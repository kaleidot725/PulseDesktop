name: Pull request check

on:
  pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Check pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '17'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3'
      - name: Install danger
        # danger asks for git >= 1.13 with no upper bound, and git 6 no longer defines Git::Base where danger reads it.
        # Installing git 5 first and danger with --conservative keeps it.
        run: |
          gem install git -v 5.6.0
          gem install --conservative danger danger-junit danger-checkstyle_format
      - name: Run test
        run: |
          ./gradlew allTests :library:mvi-mobile:testDebugUnitTest
        continue-on-error: true
      - name: Run ktlint
        run: |
          ./gradlew ktlintCheck
        continue-on-error: true
      - name: Run danger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          danger
      - name: Verify coverage
        run: |
          ./gradlew koverVerify

  ios:
    name: Test mvi-mobile on iOS
    # The iOS simulator tests need a Mac; the check above runs on Linux.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Run iOS tests
        run: |
          ./gradlew :library:mvi-mobile:iosSimulatorArm64Test
